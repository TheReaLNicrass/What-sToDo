<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What-sToDo · Dashboard</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="app-shell" id="app"></div>
    <script src="../common.js"></script>
    <script>
      (async () => {
        const common = window.AppCommon;
        document.getElementById('app').innerHTML = common.renderShell({
          pageTitle: 'Dein Dashboard',
          pageDescription: 'Hier siehst du die Projekte, bei denen du Owner oder Mitglied bist, sowie alle Aufgaben, die dir zugeordnet wurden.',
          pageKey: 'dashboard',
        });
        common.bindShell();
        const user = await common.loadSessionUser();
        if (!common.requireAuth(user)) return;

        const flattenTasks = (tasks = []) => tasks.flatMap((task) => [task, ...flattenTasks(task.subtasks || [])]);
        const projectsRes = await common.api('/projects');
        const projects = projectsRes.projects || [];
        const taskResults = await Promise.all(projects.map(async (project) => {
          const tasksRes = await common.api(`/projects/${project.id}/tasks`);
          return { project, tasks: flattenTasks(tasksRes.tasks || []) };
        }));

        const ownedProjects = projects.filter((project) => project.owner?.id === user.id);
        const memberProjects = projects.filter((project) => project.owner?.id !== user.id);
        const assignedTasks = taskResults.flatMap(({ project, tasks }) =>
          tasks.filter((task) => (task.assignees || []).some((assignee) => assignee.id === user.id)).map((task) => ({ ...task, project })),
        );

        document.getElementById('pageContent').innerHTML = `
          <section class="dashboard-actions card panel quick-actions">
            <div>
              <p class="eyebrow">Aktionen</p>
              <h3>Direkt loslegen</h3>
              <p class="muted">Wechsle in die jeweilige Erstellungsseite und komme nach dem Speichern wieder hierher zurück.</p>
            </div>
            <div class="action-row">
              <a class="primary link-button" href="/projects">Projekt anlegen</a>
              <a class="secondary link-button" href="/tasks">Aufgabe anlegen</a>
            </div>
          </section>
          <section class="content-grid dashboard-grid">
            <article class="panel card section-stack">
              <p class="eyebrow">Owner</p>
              <h3>Deine Projekte</h3>
              <div class="stack-list">${ownedProjects.length ? ownedProjects.map((project) => `<div class="list-item static"><div><strong>${common.escapeHtml(project.name)}</strong><p class="muted">${common.escapeHtml(project.description || 'Keine Beschreibung')}</p></div><div class="meta-column"><span class="badge neutral">Owner</span><span class="muted">${project.taskCount} Tasks</span></div></div>`).join('') : '<p class="muted">Du besitzt aktuell keine Projekte.</p>'}</div>
            </article>
            <article class="panel card section-stack">
              <p class="eyebrow">Mitgliedschaften</p>
              <h3>Projekte mit deiner Zuordnung</h3>
              <div class="stack-list">${memberProjects.length ? memberProjects.map((project) => `<div class="list-item static"><div><strong>${common.escapeHtml(project.name)}</strong><p class="muted">${common.escapeHtml(project.description || 'Keine Beschreibung')}</p></div><div class="meta-column"><span class="badge neutral">${common.escapeHtml(project.role)}</span><span class="muted">Owner: ${common.escapeHtml(project.owner?.name || '—')}</span></div></div>`).join('') : '<p class="muted">Keine weiteren Projektzuordnungen vorhanden.</p>'}</div>
            </article>
          </section>
          <section class="panel card section-stack">
            <p class="eyebrow">Aufgaben</p>
            <h3>Dir zugewiesene Aufgaben</h3>
            <div class="stack-list">${assignedTasks.length ? assignedTasks.map((task) => `<div class="list-item static"><div><strong>${common.escapeHtml(task.title)}</strong><p class="muted">${common.escapeHtml(task.project.name)} · ${common.escapeHtml(task.description || 'Keine Beschreibung')}</p></div><div class="meta-column"><span class="badge neutral">${common.escapeHtml(task.status)}</span><span class="muted">Deadline: ${common.escapeHtml((task.dueDate || '').slice(0, 10) || 'offen')}</span></div></div>`).join('') : '<p class="muted">Dir sind aktuell keine Aufgaben zugewiesen.</p>'}</div>
          </section>`;
      })().catch((error) => {
        const notice = document.getElementById('pageNotice');
        if (notice) {
          notice.style.display = 'block';
          notice.textContent = error.message || 'Dashboard konnte nicht geladen werden.';
        }
      });
    </script>
  </body>
</html>
